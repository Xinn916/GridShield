name: privgrid-cloud-compute-s1

services:
  compute-s1:
    image: privgrid-backend:v4
    pull_policy: never
    container_name: privgrid-compute-s1
    restart: unless-stopped
    command: ["uvicorn", "compute_node.main:app", "--host", "0.0.0.0", "--port", "8201"]
    env_file:
      - .env
    environment:
      COMPUTE_NODE_ID: S1
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
    ports:
      - "192.168.1.9:8201:8201"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8201/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
